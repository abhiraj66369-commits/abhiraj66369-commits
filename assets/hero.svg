<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260" role="img" aria-labelledby="t d">
  <title id="t">Kumar Abhinash</title>
  <desc id="d">Animated banner cycling through: Full-Stack Developer, AI Builder, Software Engineer in Progress, Product Builder.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b2e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="0.5" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.1" r="0.7">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
  </defs>
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .sans { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .line { opacity: 0; animation: cycle 12s infinite; }
    .l2 { animation-delay: 3s; } .l3 { animation-delay: 6s; } .l4 { animation-delay: 9s; }
    @keyframes cycle { 0% {opacity:0; transform:translateY(6px)} 3% {opacity:1; transform:none} 22% {opacity:1; transform:none} 25% {opacity:0} 100% {opacity:0} }
    .bar { animation: pulse 2s ease-in-out infinite; }
    @keyframes pulse { 0%,100% {opacity:1} 50% {opacity:.35} }
    @media (prefers-reduced-motion: reduce) {
      .line, .bar { animation: none; }
      .l1 { opacity: 1; }
    }
  </style>
  <rect width="900" height="260" rx="14" fill="url(#bg)"/>
  <rect width="900" height="260" rx="14" fill="url(#grid)"/>
  <rect width="900" height="260" rx="14" fill="url(#glow)"/>
  <rect x="60" y="60" width="4" height="120" rx="2" fill="url(#accent)"/>
  <text x="84" y="98" class="mono" font-size="16" fill="#8b949e">// hello, world</text>
  <text x="84" y="150" class="sans" font-size="54" font-weight="700" fill="#f0f6fc">Kumar Abhinash</text>
  <g class="mono" font-size="24" fill="#22d3ee">
    <text x="86" y="196" class="line l1">&gt; Full-Stack Developer</text>
    <text x="86" y="196" class="line l2">&gt; AI Builder</text>
    <text x="86" y="196" class="line l3">&gt; Software Engineer in Progress</text>
    <text x="86" y="196" class="line l4">&gt; Product Builder</text>
  </g>
  <rect class="bar" x="60" y="228" width="120" height="3" rx="1.5" fill="url(#accent)"/>
</svg>
