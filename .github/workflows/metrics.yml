name: Metrics

# Renders self-hosted SVG cards with lowlighter/metrics and commits them to
# metrics/. Needs one repository secret: METRICS_TOKEN (classic PAT with
# `read:user`; add `repo` if you also want private-repo activity counted).
# Commits made with GITHUB_TOKEN do not trigger other workflows, so there is no loop.

on:
  schedule:
    - cron: "37 2 * * *" # daily
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: metrics
  cancel-in-progress: false

env:
  TZ_NAME: Asia/Kolkata # change if your local timezone differs; used for the habits card

jobs:
  render:
    name: Render metric cards
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HAS_TOKEN: ${{ secrets.METRICS_TOKEN != '' }}
    steps:
      - name: Check for METRICS_TOKEN
        run: |
          if [ "$HAS_TOKEN" != "true" ]; then
            echo "::warning::Secret METRICS_TOKEN is not set. Skipping. See docs/SETUP.md."
          fi

      - name: Check out repository
        if: env.HAS_TOKEN == 'true'
        uses: actions/checkout@v4

      - name: Overview card
        if: env.HAS_TOKEN == 'true'
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: ${{ github.repository_owner }}
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: ${{ env.TZ_NAME }}
          filename: github-metrics.svg
          output_action: none

      - name: Languages card
        if: env.HAS_TOKEN == 'true'
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: ${{ github.repository_owner }}
          template: classic
          base: ""
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
          filename: languages.svg
          output_action: none

      - name: Streak card
        if: env.HAS_TOKEN == 'true'
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: ${{ github.repository_owner }}
          template: classic
          base: ""
          plugin_streak: yes
          filename: streak.svg
          output_action: none

      - name: Isometric calendar
        if: env.HAS_TOKEN == 'true'
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: ${{ github.repository_owner }}
          template: classic
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          filename: isocalendar.svg
          output_action: none

      - name: Coding habits
        if: env.HAS_TOKEN == 'true'
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: ${{ github.repository_owner }}
          template: classic
          base: ""
          config_timezone: ${{ env.TZ_NAME }}
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 14
          plugin_habits_facts: yes
          plugin_habits_charts: yes
          filename: habits.svg
          output_action: none

      - name: Achievements
        if: env.HAS_TOKEN == 'true'
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: ${{ github.repository_owner }}
          template: classic
          base: ""
          plugin_achievements: yes
          plugin_achievements_threshold: C
          plugin_achievements_display: compact
          filename: achievements.svg
          output_action: none

      - name: Starred topics
        if: env.HAS_TOKEN == 'true'
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: ${{ github.repository_owner }}
          template: classic
          base: ""
          plugin_topics: yes
          plugin_topics_mode: starred
          plugin_topics_limit: 15
          filename: topics.svg
          output_action: none

      - name: Commit rendered cards
        if: env.HAS_TOKEN == 'true'
        run: |
          set -euo pipefail
          if [ ! -d /metrics_renders ]; then
            echo "::error::/metrics_renders not found. Set output_action: commit on the steps above (see docs/SETUP.md, Troubleshooting)."
            exit 1
          fi
          ls -la /metrics_renders/
          # Only copy files that are non-empty SVGs, so a failed render never overwrites a good card.
          for f in /metrics_renders/*.svg; do
            [ -s "$f" ] && grep -q "<svg" "$f" && cp "$f" metrics/
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add metrics/*.svg
          if git diff --cached --quiet; then
            echo "No metric changes."
          else
            git commit -m "chore(metrics): refresh cards [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
