name: Quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Profile validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Structure, accessibility and hygiene checks
        run: python scripts/validate_profile.py
      - name: README sections are up to date
        run: python scripts/update_readme.py --check

  markdown:
    name: Markdown lint (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true # promote to blocking once it has run clean on your repo
    steps:
      - uses: actions/checkout@v4
      - uses: DavidAnson/markdownlint-cli2-action@v24
        with:
          globs: |
            README.md
            SECURITY.md
            CHANGELOG.md
            docs/*.md
            certificates/README.md

  workflows:
    name: Lint workflows
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run actionlint
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color

  links:
    name: Link check (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true # external sites are flaky; failures are informational
    steps:
      - uses: actions/checkout@v4
      - uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --config .lychee.toml README.md docs/*.md
          fail: true

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
